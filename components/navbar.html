<!-- Shared site header. Injected into #navbar by /assets/js/main.js; styles live in style.css (section 12). -->

<!-- The checkbox drives the mobile drawer with CSS only. It must stay a sibling of .site-header, .drawer-overlay and .drawer. -->
<input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Toggle navigation menu">

<header class="site-header">
  <a href="/" class="site-logo" aria-label="Logrith home">
    <img src="/assets/img/logo.webp" alt="" width="28" height="28">
    <span>Logrith</span>
  </a>

  <nav class="site-nav" aria-label="Primary">
    <a href="/ai-technology/">AI &amp; Developer Tools</a>
    <a href="/startups-business/">Build &amp; Ship</a>
    <a href="/tool/">Tools</a>
  </nav>

  <div class="site-header-actions">
    <a class="lang-switch" data-lang-switch hidden>ES</a>
    <button type="button" class="site-header-search" data-search-toggle aria-label="Search tools" aria-expanded="false" aria-controls="header-search"><svg class="icon icon-inline" aria-hidden="true"><use href="/assets/svg/icons.svg#search"></use></svg></button>
    <label for="menu-toggle" class="menu-btn" aria-label="Open menu"><svg class="icon icon-inline" aria-hidden="true"><use href="/assets/svg/icons.svg#menu"></use></svg></label>
  </div>

  <!-- Search panel: opened by the search button, filled by initToolSearch() in main.js. -->
  <div class="header-search" id="header-search" hidden>
    <div class="header-search-inner">
      <input type="search" data-tool-search placeholder="Search tools, e.g. JSON formatter" aria-label="Search tools" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </div>
  </div>
</header>

<label for="menu-toggle" class="drawer-overlay" aria-hidden="true"></label>

<aside class="drawer" aria-label="Mobile navigation">
  <div class="drawer-top">
    <a href="/" class="drawer-title">Logrith</a>
    <label for="menu-toggle" class="drawer-close" aria-label="Close menu"><svg class="icon icon-inline" aria-hidden="true"><use href="/assets/svg/icons.svg#close"></use></svg></label>
  </div>

  <a href="/">Home</a>
  <a href="/ai-technology/">AI &amp; Developer Tools</a>
  <a href="/startups-business/">Build &amp; Ship</a>
  <a href="/tool/">Tools</a>

  <hr>

  <a href="/pages/about">About</a>
  <a href="/pages/contact">Contact</a>
  <a href="/pages/privacy">Privacy</a>
  <a href="/pages/terms">Terms</a>

  <a class="drawer-lang" data-lang-switch data-lang-full hidden>Español</a>
</aside>
